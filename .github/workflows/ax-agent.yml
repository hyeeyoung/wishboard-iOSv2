name: AX Agent

on:
  issues:
    types: [labeled, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent:
    if: |
      (github.event_name == 'issues' && 
       contains(github.event.issue.labels.*.name, 'agent-task')) ||
      (github.event_name == 'issue_comment' && 
       contains(github.event.comment.body, '/agent')) ||
      (github.event_name == 'issues' && 
       github.event.action == 'reopened' &&
       contains(github.event.issue.labels.*.name, 'agent-task'))
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Debug runner environment
        run: |
          echo "USER: $USER"
          echo "HOME: $HOME"
          echo "PATH: $PATH"
          echo "claude 위치: $(which claude || echo 'not found')"
          echo "--- ~/.claude/ ---"
          ls -la ~/.claude/ 2>&1 || echo "no such dir"
          echo "--- claude ping ---"
          claude --print "ping" 2>&1 | head -10 || true

      - name: Run Claude Code Agent
        run: |
          claude --print "
            GitHub Issue #${{ github.event.issue.number }} 의
            이슈 본문, 모든 코멘트 히스토리, 연결된 PR 내역을
            전부 읽고 전체 맥락을 파악한 후 작업해줘.
            코멘트로 재실행된 경우 가장 최근 코멘트를 추가 요구사항으로 반영해줘.

            작업 순서:
            1. dev 브랜치 기반으로 feature/issue-${{ github.event.issue.number }} 브랜치 생성
               (이미 브랜치가 있으면 그 브랜치에서 이어서 작업)
            2. 요구사항에 맞게 코드 작업
            3. 이슈에 '캡처할 화면' 항목이 있으면:
               - XCTest 스냅샷 코드 임시 작성
               - 시뮬레이터 실행 후 스크린샷 캡처
               - 캡처 완료 후 테스트 코드 즉시 삭제
            4. dev 브랜치로 PR 생성
               - 이미 PR이 있으면 새로 만들지 말고 기존 PR 업데이트
               - 스크린샷은 별도 브랜치 생성 없이 GitHub PR에 직접 이미지 업로드 방식으로 첨부
               - 변경 사항 한국어로 설명
          " --allowedTools "Bash,Edit,Write,mcp__github__*"
        env:
          # LaunchAgent 컨텍스트에선 macOS Keychain 접근 불가 → CI용 장기 토큰 사용
          # 발급: `claude setup-token` (러너 머신 터미널에서 1회)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
