name: AX Agent

on:
  issues:
    types: [labeled]

jobs:
  agent:
    if: contains(github.event.issue.labels.*.name, 'agent-task')
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Run Claude Code Agent
        run: |
          claude --print "
            GitHub Issue #${{ github.event.issue.number }} 내용을 읽고
            dev 브랜치 기반으로 feature/issue-${{ github.event.issue.number }} 브랜치를 새로 만들어서
            요구사항에 맞게 코드를 작성한 후
            dev 브랜치로 PR을 생성해줘.
            PR 본문에 변경 사항을 한국어로 설명해줘.
          " --allowedTools "Bash,Edit,Write,mcp__github__*"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
