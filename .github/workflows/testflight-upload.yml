name: TestFlight Upload

on:
  schedule:
    # 매일 자정 KST (= 15:00 UTC) 에 실행
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      build_number_override:
        description: '빌드 번호 수동 지정 (비워두면 자동: YYYYMMDDHHmm)'
        required: false
        default: ''
        type: string
      skip_commit_check:
        description: '커밋 체크 건너뛰기 (수동 실행 시 무조건 빌드)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: testflight-upload
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upload-testflight:
    runs-on: self-hosted

    env:
      TEAM_ID: B974XY47GZ
      SCHEME: WishboardV2
      CONFIGURATION: Release
      ARCHIVE_PATH: /tmp/WishboardV2_CI.xcarchive
      EXPORT_PATH: /tmp/WishboardV2_CI_Export

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Check for new commits (스케줄 실행 시만)
        id: commit_check
        run: |
          # 수동 실행이고 skip_commit_check=true 이면 항상 빌드
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_commit_check }}" = "true" ]; then
            echo "Manual run – skipping commit check."
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 지난 25시간 이내 dev 브랜치 커밋 확인
          SINCE=$(date -u -v-25H "+%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u -d "25 hours ago" "+%Y-%m-%dT%H:%M:%SZ")
          COMMIT_COUNT=$(git log origin/dev --since="$SINCE" --oneline | wc -l | tr -d " ")
          echo "Commits in last 25h: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -eq "0" ]; then
            echo "No new commits – skipping TestFlight upload."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New commits found – proceeding with build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup App Store Connect API Key
        if: steps.commit_check.outputs.should_build == 'true'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_API_KEY_CONTENT }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      - name: Set Build Number
        if: steps.commit_check.outputs.should_build == 'true'
        run: |
          if [ -n "${{ inputs.build_number_override }}" ]; then
            echo "BUILD_NUMBER=${{ inputs.build_number_override }}" >> $GITHUB_ENV
          else
            echo "BUILD_NUMBER=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          fi

      - name: Archive App
        if: steps.commit_check.outputs.should_build == 'true'
        run: |
          rm -rf "${{ env.ARCHIVE_PATH }}"
          xcodebuild archive \
            -project WishboardV2.xcodeproj \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ env.CONFIGURATION }}" \
            -archivePath "${{ env.ARCHIVE_PATH }}" \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION="${{ env.BUILD_NUMBER }}" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ env.TEAM_ID }}" \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_API_ISSUER_ID }} \
            -allowProvisioningUpdates

      - name: Export & Upload to TestFlight
        if: steps.commit_check.outputs.should_build == 'true'
        run: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>${{ env.TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          rm -rf "${{ env.EXPORT_PATH }}"
          xcodebuild -exportArchive \
            -archivePath "${{ env.ARCHIVE_PATH }}" \
            -exportPath "${{ env.EXPORT_PATH }}" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_API_ISSUER_ID }} \
            -allowProvisioningUpdates

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
          rm -rf "${{ env.ARCHIVE_PATH }}" "${{ env.EXPORT_PATH }}"
